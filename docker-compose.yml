services:
  keycloak:
    image: quay.io/keycloak/keycloak:26
    container_name: cards-api-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./src/main/resources/quarkus-realm.json:/opt/keycloak/data/import/quarkus-realm.json
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3; if [ $? -eq 0 ]; then echo 'Healthcheck Successful'; exit 0; else echo 'Healthcheck Failed'; exit 1; fi"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mysql:
    image: mariadb:10.11
    container_name: cards-api-mysql
    environment:
      MARIADB_DATABASE: cards_api
      MARIADB_USER: ${MARIADB_USER:-cards}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-cards}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  cards-api:
    build:
      context: .
    container_name: cards-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_JDBC_URL: jdbc:mariadb://mysql:3306/cards_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-cards}
      DB_PASSWORD: ${DB_PASSWORD:-cards}
      KEYCLOAK_URL: http://host.docker.internal:8180
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-quarkus}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-secret}
      CARRIER_WEBHOOK_API_KEY: ${CARRIER_WEBHOOK_API_KEY:-carrier-local-key}
      PROCESSOR_WEBHOOK_API_KEY: ${PROCESSOR_WEBHOOK_API_KEY:-processor-local-key}
      CVV_DEFAULT_TTL_SECONDS: ${CVV_DEFAULT_TTL_SECONDS:-900}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
