# Overrides de teste (@QuarkusTest). Mescla com o application.properties principal.
# Banco real via Dev Services (testcontainers/MariaDB); identidade via @TestSecurity.

# Usa Dev Services para o datasource: a URL nao e definida no perfil de teste (ver
# application.properties principal), e sem URL o Quarkus sobe o banco pelos Dev Services.
quarkus.datasource.devservices.enabled=true

# Nao sobe Keycloak em teste: a identidade e injetada por @TestSecurity/@JwtSecurity.
quarkus.keycloak.devservices.enabled=false

# O tenant OIDC continua ativo em teste — e o que faz @JwtSecurity entregar um JsonWebToken com o
# claim `sub`, de que depende a autorizacao por objeto. O que se desliga e a descoberta: sem ela o
# boot nao procura o IdP, e nenhum Keycloak precisa subir. A partir do Quarkus 3.40 a extensao exige
# `auth-server-url` declarada quando o tenant esta ligado, ainda que nunca seja contatada.
quarkus.oidc.auth-server-url=http://localhost:8180/realms/cards-api
quarkus.oidc.discovery-enabled=false
quarkus.oidc.client-id=cards-api-test
# Caminho exigido pela extensao quando a descoberta esta desligada; nunca e chamado em teste,
# porque a identidade vem de @TestSecurity e nenhum token externo chega a ser verificado.
quarkus.oidc.jwks-path=/protocol/openid-connect/certs

# A recuperacao de remessas e exercitada pelos testes de forma explicita, nao por agendamento.
quarkus.scheduler.enabled=false
