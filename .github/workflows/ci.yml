name: CI

on:
  pull_request:
  push:
    branches: [master, develop, 'feature/**', 'fix/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes (Quarkus/Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes unitarios e empacotamento
        run: mvn -ntp -B verify

      # A exclusao vem da property `surefire.excluded.groups`: com <excludedGroups> fixo no POM,
      # -DexcludedGroups= nao tinha efeito e este passo executava zero testes.
      - name: Testes de integracao (Dev Services / Docker)
        run: mvn -ntp -B test -Dgroups=integration -Dsurefire.excluded.groups=

  image-scan:
    name: Imagem final e scan bloqueante
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      # Mesma imagem da entrega: mesmo Dockerfile, mesmo contexto, sem perfil alternativo.
      - name: Construir a imagem final
        run: docker build -t cards-api:${{ github.sha }} .

      # Gate bloqueante: um achado HIGH ou CRITICAL reprova o job. Sem continue-on-error,
      # sem exit-code 0, sem ignore-unfixed e sem lista de exclusao.
      - name: Scan da imagem final
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cards-api:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'
          format: 'table'
          output: 'trivy-image.txt'

      - name: Publicar o relatorio do scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image
          path: trivy-image.txt
          if-no-files-found: warn
